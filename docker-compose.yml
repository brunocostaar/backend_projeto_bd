# Sistema de Gestão Hospitalar - PostgreSQL de desenvolvimento
#
# Subir (na primeira vez executa os scripts numerados, na ordem: schema e seed
# da Etapa 1, depois estrutura, procedures, triggers, views e seed da Etapa 2):
#   docker compose up -d
#
# O 04_analiticas.sql e o 10_etapa2_verificacao.sql ficam fora da lista de
# propósito: só contêm consultas, e são feitos para execução manual.
#
# Conectar:
#   docker compose exec db psql -U postgres -d hospital_universitario
#
# Recriar o banco do zero (apaga os dados e roda os scripts de novo):
#   docker compose down -v
#   docker compose up -d
#
# Obs.: os scripts em /docker-entrypoint-initdb.d só rodam quando o volume
# de dados está vazio (primeiro up ou após down -v).

services:
  db:
    image: postgres:16-alpine
    container_name: hospital_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./05_etapa2_estrutura.sql:/docker-entrypoint-initdb.d/05_etapa2_estrutura.sql:ro
      - ./06_etapa2_procedures.sql:/docker-entrypoint-initdb.d/06_etapa2_procedures.sql:ro
      - ./07_etapa2_triggers.sql:/docker-entrypoint-initdb.d/07_etapa2_triggers.sql:ro
      - ./08_etapa2_views.sql:/docker-entrypoint-initdb.d/08_etapa2_views.sql:ro
      - ./09_etapa2_seed.sql:/docker-entrypoint-initdb.d/09_etapa2_seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_universitario"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
