[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
markers =
    slow: tests that take longer to run
    db: tests that require the database
    http: contracts exercised through FastAPI TestClient
    concurrency: tests that open independent database sessions
    adversarial: race conditions and integrity edge cases
